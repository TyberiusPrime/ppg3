[workspace]
resolver = "2"
members = ["crates/ppg3-core", "crates/ppg3-cli", "crates/ppg3-py"]
default-members = ["crates/ppg3-core", "crates/ppg3-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
fs2 = "0.4"
libc = "0.2"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
