name: release

on:
  release:

# The Python package (pyproject.toml + maturin config) lives under python/,
# with the pyo3 crate at py/ and the workspace at the repo root; maturin
# reaches up via `manifest-path = "../py/Cargo.toml"`, so every maturin step
# runs from the python/ working directory.

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: build wheels
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        working-directory: python
        manylinux: auto
        command: build
        args: --release -o dist
    - name: build sdist
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        working-directory: python
        command: sdist
        args: -o dist
    - name: Upload wheels
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wheels
        path: python/dist

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ linux ]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels
      - name: Publish to PyPI
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing *
