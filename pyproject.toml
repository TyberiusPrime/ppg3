[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ppg3"
version = "0.1.0"
description = "ppg3 — constructive-trace build system, Python front-end"
requires-python = ">=3.9"
dependencies = ["libcst", "cloudpickle", "blake3"]

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
manifest-path = "crates/ppg3-py/Cargo.toml"
python-source = "python"
module-name = "ppg3._core"
features = ["pyo3/extension-module"]
